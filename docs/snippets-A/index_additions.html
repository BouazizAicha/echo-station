<!--
  PARTIE 6 / index_additions.html
  HTML + CSS à ajouter à index.html et css/style.css.
  La version complète est déjà branchée dans index.html et css/style.css.
-->

<!-- 1. Dans l'écran radio, remplacer le bloc « Manual tuning » par : -->
<div id="skymap-wrap" class="map-panel">
  <canvas id="skymap" width="900" height="600" tabindex="0" role="img"
    aria-label="Sky map. The green reticle at the centre is your aim. Drag to pan, or use the arrow keys."></canvas>
  <p class="map-caption">Drag · arrow keys (Shift = faster) · Home recentres on the Moon</p>
</div>

<!-- 2. Le compteur, dans l'en-tête de l'écran radio : -->
<p id="counter" class="counter" aria-label="Robots found"></p>

<!-- 3. La flèche de guidage, à côté de la carte : -->
<section id="guide" class="guide" aria-label="Guidance arrow">
  <div class="guide-ring" aria-hidden="true"></div>
  <div id="guide-arrow" class="guide-arrow" aria-hidden="true">➜</div>
  <p id="guide-text" class="guide-text" aria-live="polite">Follow the arrow.</p>
</section>

<!-- 4. Le mode debug, dans l'écran radio : -->
<p id="debug" class="debug mono" hidden></p>

<!-- 5. Le délai lumière, dans l'écran Histoire (avec B) : -->
<p id="story-light" class="light-time">Light-time: —</p>

<!-- 6. La liste accessible (garder la liste dans un <details>) : -->
<details id="list-view" class="panel list-view">
  <summary>List view</summary>
  <ul id="target-list"></ul>
</details>

<style>
  /* --- Indispensable : sans cette règle, la carte ne se cache pas --- */
  #skymap[hidden] {
    display: none !important;
  }

  #skymap {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #070b14;
    touch-action: none;
    cursor: grab;
  }

  #skymap:active {
    cursor: grabbing;
  }

  .counter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .counter-item {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.7rem;
  }

  .counter-item[data-complete="true"] {
    border-color: rgba(110, 247, 165, 0.5);
    background: rgba(110, 247, 165, 0.14);
    color: var(--green);
  }

  .guide {
    --lock: 0;
    position: relative;
    display: grid;
    grid-template-columns: 84px 1fr;
    align-items: center;
    gap: 8px;
    min-height: 112px;
    padding: 14px 18px 14px 12px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.015);
  }

  .guide-ring {
    position: absolute;
    top: 21px;
    left: 21px;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: conic-gradient(var(--green) calc(var(--lock) * 1turn), rgba(110, 247, 165, 0.12) 0);
    -webkit-mask: radial-gradient(circle, transparent 34px, #000 35px);
    mask: radial-gradient(circle, transparent 34px, #000 35px);
  }

  .guide-arrow {
    position: relative;
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    color: var(--green);
    font-size: 2.6rem;
    transform: rotate(0deg);
    transform-origin: center;
    transition: transform 140ms ease-out;
  }

  .guide-arrow[data-below-horizon="true"] {
    opacity: 0.28;
  }

  .guide-text {
    position: relative;
    font-size: 0.95rem;
  }

  .debug {
    padding: 10px 12px;
    border: 1px dashed rgba(255, 196, 107, 0.35);
    border-radius: 12px;
    color: #ffd89a;
    font-size: 0.66rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .debug[hidden] {
    display: none;
  }

  @media (max-width: 620px) {
    #skymap {
      aspect-ratio: 4 / 3;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .guide-arrow {
      transition: none;
    }
  }
</style>
